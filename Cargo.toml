[workspace]
resolver = "2"
members = [
    "crates/moonglass-core",
    "crates/moonglass-scan",
    "crates/moonglass-db",
    "crates/moonglass-platform",
    "crates/moonglass-launcher",
    "crates/moonglass-art",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "Apache-2.0"
# An application, not a library: never published to crates.io.
publish = false
# Releases are published here; Settings → System → Updates reads them.
repository = "https://github.com/hxpe-dev/moonglass-launcher"
rust-version = "1.94"

# Cargo.lock holds libc at 0.2.186 (and mio at 1.2.4, which allows it): GPUI
# 0.2.2 pulls in xattr 0.2.3, which uses libc::ENOATTR, gone on Linux from
# libc 0.2.191. A plain `cargo update` brings the Linux build failure back;
# use `cargo update -p <crate>` until GPUI is upgraded.

[workspace.dependencies]
moonglass-core = { path = "crates/moonglass-core" }
moonglass-scan = { path = "crates/moonglass-scan" }
moonglass-db = { path = "crates/moonglass-db" }
moonglass-platform = { path = "crates/moonglass-platform" }
moonglass-art = { path = "crates/moonglass-art" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
keyvalues-parser = "0.2"
walkdir = "2"
unicode-normalization = "0.1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
directories = "6"
tempfile = "3"

# Image decoding and blurring are far too slow unoptimized; keep the rest of
# the dev build fast to compile.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.moonglass-art]
opt-level = 3
