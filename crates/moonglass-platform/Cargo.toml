[package]
name = "moonglass-platform"
description = "Everything OS-specific in Moonglass, behind one interface with a Windows and a Linux implementation (spec 4.3). No other crate contains platform conditionals."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
sysinfo.workspace = true
directories.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[dev-dependencies]
tempfile.workspace = true
