[package]
name = "moonglass-launcher"
description = "Moonglass, a console-style PC game launcher: the GPUI carousel and a debug CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "moonglass"
path = "src/main.rs"

[dependencies]
moonglass-core.workspace = true
moonglass-scan.workspace = true
moonglass-db.workspace = true
moonglass-platform.workspace = true
moonglass-art.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# fs and io-util: update downloads are written as they arrive.
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
notify-debouncer-mini = "0.6"
# GPUI is pre-1.0; pinned to an exact version and upgraded deliberately (spec 4.1).
gpui = "=0.2.2"
futures = "0.3"
# The same HTTP stack as moonglass-art, for Steam's Web API (friends).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
raw-window-handle = "0.6"
# Checks downloaded updates against the digest GitHub publishes.
sha2 = "0.10"
gilrs = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# UI sounds and background music. Only the decoders for common music files.
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav", "tracing"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3"
