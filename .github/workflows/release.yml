name: Release

# Spec 4.5: Windows .exe and zip; Linux tarball and AppImage, published as
# a GitHub release that installed copies update from.
#
# Releasing is changing `version` in the root Cargo.toml and pushing to
# main: when no tag `v<version>` exists yet, this tests and builds both
# platforms, then publishes release `v<version>` (made a pre-release when
# the version has a suffix, such as 0.1.0-beta.1). Pushes that leave the
# version alone release nothing. Running the workflow by hand on main
# retries a release that failed; on another branch it only builds.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

# Two pushes in a row must not race to publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            publish=false
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            publish=true
          else
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish, pre-release $pre"

  # The licenses of everything built into the program, shipped with it.
  notices:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Third-party notices
        run: scripts/third-party-notices.sh
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: dist/THIRD-PARTY-NOTICES.html

  windows:
    needs: [version, notices]
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p moonglass-launcher
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - name: Inno Setup (the installer)
        run: choco install innosetup --no-progress -y
      - name: Package
        run: powershell -File scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: [version, notices]
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (GPUI, gilrs) and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev pkg-config librsvg2-bin file
      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p moonglass-launcher
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - name: Package
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    needs: [version, windows, linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on the commit that was built.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Moonglass ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
