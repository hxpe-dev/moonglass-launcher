<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Moonglass">
  <!-- A moon over still glass: the disc, the horizon, and its reflection
       breaking into lines below. -->
  <rect width="512" height="512" rx="104" fill="#000"/>
  <g fill="#fff">
    <circle cx="256" cy="180" r="92"/>
    <rect x="88" y="290" width="336" height="12"/>
    <rect x="164" y="326" width="184" height="12"/>
    <rect x="188" y="356" width="136" height="12"/>
    <rect x="212" y="386" width="88" height="12"/>
    <rect x="236" y="416" width="40" height="12"/>
  </g>
</svg>
