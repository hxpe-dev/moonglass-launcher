<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Moonglass">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2440"/>
      <stop offset="1" stop-color="#06080E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#5A78C8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5A78C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#AFC0F0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="256" cy="256" r="150" fill="#FFF"/>
      <circle cx="312" cy="218" r="128" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#night)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- The glass: a disc the moon is seen through. -->
  <circle cx="256" cy="256" r="150" fill="url(#glass)"/>
  <circle cx="256" cy="256" r="149" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- The moon: the lit edge of the same disc. -->
  <circle cx="256" cy="256" r="150" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- A highlight on the glass. -->
  <path d="M330 168a112 112 0 0 1 44 78" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
</svg>
